name: Update Travel & Disaster Data

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간(KST) 새벽 3시 자동 실행
  workflow_dispatch:     # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  fetch-and-clean:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: data 디렉토리 생성
      run: mkdir -p data

    # 🌟 [1단계] EU INFORM API에서 국가별 리스크 스코어 직접 추출 (JSON)
    # 인증 불필요. 전 세계 국가의 ISO3/ISO2 코드가 포함되어 매핑 에러가 없습니다.
    - name: 국가별 위험도 데이터 추출 (EU INFORM API)
      run: |
        # 최신 글로벌 위험도 인덱스 JSON 가져오기
        curl -f -s "https://drmkc.jrc.ec.europa.eu/inform-index/API/InformAPI/Search?term=INFORM%20Risk" -o inform_raw.json || echo '[]' > inform_raw.json

        python3 - << 'PYEOF'
        import json

        try:
            with open("inform_raw.json", encoding="utf-8") as f:
                raw_data = json.load(f)
        except Exception as e:
            print(f"INFORM API 파싱 실패: {e}")
            raw_data = []

        results = []
        
        # API 응답 구조를 순회하며 ISO 코드와 위험도 점수(Risk Score) 추출
        for item in raw_data:
            iso2 = item.get("Iso2") or item.get("ISO2")
            if not iso2:
                continue
                
            results.append({
                "iso_code": iso2.upper(),
                "name": item.get("CountryName") or item.get("Country"),
                "risk_score": float(item.get("RiskScore") or item.get("IndicatorValue") or 0.0),
                "last_updated": item.get("Year") or ""
            })

        print(f"총 {len(results)}개국 위험도(INFORM) 추출 완료")

        with open("data/travel_risk.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

        rm -f inform_raw.json

    # 🌟 [2단계] GDACS 공식 API에서 실시간 재난 데이터 직접 추출 (지도 마커용)
    - name: 실시간 재난(GDACS) 데이터 추출
      run: |
        curl -f -s "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=EQ;TC;FL;VO;WF;DR&alertlevel=green;orange;red" \
          -o gdacs_raw.json || echo '{"features":[]}' > gdacs_raw.json

        python3 - << 'PYEOF'
        import json

        try:
            with open("gdacs_raw.json", encoding="utf-8") as f:
                raw = json.load(f)
        except Exception as e:
            print(f"GDACS 응답 파싱 실패: {e}")
            raw = {"features": []}

        features = raw.get("features", [])
        results = []

        for feat in features:
            props = feat.get("properties", {})
            geom = feat.get("geometry", {}) or {}
            coords = geom.get("coordinates", [])

            # 위경도 좌표가 없으면 지도 마커로 찍을 수 없으므로 패스
            if not coords or len(coords) < 2:
                continue
            lng, lat = coords[0], coords[1]

            event_type = props.get("eventtype", "Disaster") # EQ(지진), TC(태풍), FL(홍수) 등
            country = props.get("country", "")
            title = f"[{event_type}] {props.get("eventname", "Disaster")}"
            if country:
                title += f" - {country}"

            results.append({
                "latitude": lat,
                "longitude": lng,
                "type": event_type,  # 마커 아이콘 분기용 (EQ, TC, FL 등)
                "title": title,
                "summary": props.get("description", "") or props.get("htmldescription", ""),
                "last_updated": props.get("todate") or props.get("fromdate") or "",
                "severity": props.get("alertlevel", "").lower(), # green, orange, red (마커 색상용)
            })

        print(f"총 {len(results)}건 재난 마커 데이터 추출 완료")

        with open("data/realtime_disasters.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

        rm -f gdacs_raw.json
        echo '{ "status": "success", "data": [] }' > data/realtime_alerts.json

    # 🌟 [3단계] 변동 사항이 있을 때만 깃허브에 커밋 및 푸시
    - name: 변경사항 자동 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add data/travel_risk.json data/realtime_disasters.json data/realtime_alerts.json
        
        if ! git diff --cached --exit-code; then
          git commit -m "⚡ EU INFORM + GDACS 공식 API 기반 글로벌 데이터 갱신"
          git push
        else
          echo "업데이트된 신규 위험 정보 없음"
        fi
