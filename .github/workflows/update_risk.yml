name: Update Travel & Disaster Data

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간(KST) 새벽 3시 자동 실행
  workflow_dispatch:     # 깃허브 웹에서 수동 실행 버튼 활성화
  repository_dispatch:   # 🌟 구글 앱스 스크립트(GAS) 호출을 받기 위한 설정
    types: [update-travel-disaster]

jobs:
  fetch-and-clean:
    runs-on: ubuntu-latest
    concurrency:
      group: travel-disaster-data
      cancel-in-progress: false

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 및 의존성 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 파이어베이스 패키지 설치
      run: |
        pip install firebase-admin

    - name: data 디렉토리 생성
      run: mkdir -p data

    # [1단계] 국가별 위험도 데이터 추출
    - name: 국가별 위험도 데이터 추출 (State Dept 공식 RSS)
      run: |
        curl -f -s "https://travel.state.gov/_res/rss/TAsTWs.xml" -o state_dept_raw.xml
        python3 scripts/fetch_travel_risk.py
        rm -f state_dept_raw.xml

    # [2단계] 실시간 재난(GDACS) 데이터 추출 및 상세정보 보강 (FCM 알림 포함)
    - name: 실시간 재난(GDACS) 데이터 추출 및 API 보강
      env:
        # 🌟 깃허브 세팅(Secrets)에 등록한 파이어베이스 인증 키를 파이썬 환경변수로 전달합니다.
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      run: |
        python3 scripts/fetch_and_enrich_gdacs.py
        # 알림용 임시 파일 생성이 필요 없는 구조이지만, 파이프라인 호환성을 위해 유지합니다.
        echo '{ "status": "success", "data": [] }' > data/realtime_alerts.json

    # [3단계] 최종 데이터 변경 감지 및 자동 배포
    - name: 변경사항 자동 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add data/travel_risk.json data/realtime_disasters.json data/realtime_alerts.json data/unmatched_countries.log data/sent_disaster_ids.json

        if ! git diff --cached --exit-code; then
          git commit -m "🚀 GDACS 수집-보강 단일 파이프라인 통합 및 FCM 푸시 알림 발송 완료"
          git pull --rebase origin main
          git push
        else
          echo "업데이트된 신규 위험 정보 없음"
        fi
