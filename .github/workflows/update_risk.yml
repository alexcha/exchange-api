
name: Update Travel & Disaster Data

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간(KST) 새벽 3시 자동 실행
  workflow_dispatch:     # 수동 실행 버튼 활성화

jobs:
  fetch-and-clean:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: data 디렉토리 생성
      run: mkdir -p data

    # 🌟 [1단계] 국가별 위험도 데이터 추출 (누락 예외 완벽 대응판)
    - name: 국가별 위험도 데이터 추출 (State Dept 공식 RSS)
      run: |
        curl -f -s "https://travel.state.gov/_res/rss/TAsTWs.xml" -o state_dept_raw.xml

        python3 - << 'PYEOF'
        import json
        import re
        import unicodedata
        import xml.etree.ElementTree as ET

        # ── 국가명(정규화된 소문자, 악센트 제거) -> ISO2 매핑 ──
        NAME_TO_ISO2 = {
            "afghanistan": "AF", "albania": "AL", "algeria": "DZ", "andorra": "AD", "angola": "AO",
            "antigua and barbuda": "AG", "argentina": "AR", "armenia": "AM", "australia": "AU",
            "austria": "AT", "azerbaijan": "AZ", "bahamas": "BS", "the bahamas": "BS", "bahrain": "BH",
            "bangladesh": "BD", "barbados": "BB", "belarus": "BY", "belgium": "BE", "belize": "BZ",
            "benin": "BJ", "bhutan": "BT", "bolivia": "BO", "bosnia and herzegovina": "BA",
            "botswana": "BW", "brazil": "BR", "brunei": "BN", "brunei darussalam": "BN",
            "bulgaria": "BG", "burkina faso": "BF", "burma": "MM", "burma (myanmar)": "MM",
            "myanmar": "MM", "burundi": "BI", "cabo verde": "CV", "cape verde": "CV",
            "cambodia": "KH", "cameroon": "CM", "canada": "CA", "central african republic": "CF",
            "chad": "TD", "chile": "CL", "china": "CN", "mainland china": "CN",
            "colombia": "CO", "comoros": "KM", "democratic republic of the congo": "CD",
            "dr congo": "CD", "congo-kinshasa": "CD", "republic of the congo": "CG",
            "congo-brazzaville": "CG", "costa rica": "CR", "cote d ivoire": "CI",
            "cote d'ivoire": "CI", "ivory coast": "CI", "croatia": "HR",
            "cuba": "CU", "cyprus": "CY", "czech republic": "CZ", "czechia": "CZ",
            "denmark": "DK", "kingdom of denmark": "DK", "djibouti": "DJ", "dominica": "DM",
            "dominican republic": "DO", "ecuador": "EC", "egypt": "EG", "el salvador": "SV",
            "equatorial guinea": "GQ", "eritrea": "ER", "estonia": "EE", "eswatini": "SZ",
            "swaziland": "SZ", "ethiopia": "ET", "fiji": "FJ", "finland": "FI", "france": "FR",
            "gabon": "GA", "gambia": "GM", "the gambia": "GM", "georgia": "GE", "germany": "DE",
            "ghana": "GH", "greece": "GR", "grenada": "GD", "guatemala": "GT", "guinea": "GN",
            "guinea-bissau": "GW", "guyana": "GY", "haiti": "HT", "honduras": "HN",
            "hong kong": "HK", "hungary": "HU", "iceland": "IS", "india": "IN", "indonesia": "ID",
            "iran": "IR", "iraq": "IQ", "ireland": "IE", "israel": "IL", "italy": "IT",
            "jamaica": "JM", "japan": "JP", "jordan": "JO", "kazakhstan": "KZ", "kenya": "KE",
            "kiribati": "KI", "north korea": "KP", "kosovo": "XK", "kuwait": "KW",
            "kyrgyz republic": "KG", "kyrgyzstan": "KG", "the kyrgyz republic": "KG",
            "laos": "LA", "lao people's democratic republic": "LA", "latvia": "LV",
            "lebanon": "LB", "lesotho": "LS", "liberia": "LR", "libya": "LY",
            "liechtenstein": "LI", "lithuania": "LT", "luxembourg": "LU", "macau": "MO",
            "madagascar": "MG", "malawi": "MW", "malaysia": "MY", "maldives": "MV", "mali": "ML",
            "malta": "MT", "marshall islands": "MH", "mauritania": "MR", "mauritius": "MU",
            "mexico": "MX", "micronesia": "FM", "federated states of micronesia": "FM",
            "moldova": "MD", "republic of moldova": "MD", "monaco": "MC", "mongolia": "MN",
            "montenegro": "ME", "montserrat": "MS", "morocco": "MA", "mozambique": "MZ",
            "namibia": "NA", "nauru": "NR", "nepal": "NP", "netherlands": "NL",
            "new zealand": "NZ", "nicaragua": "NI", "niger": "NE", "nigeria": "NG",
            "north macedonia": "MK", "macedonia": "MK", "norway": "NO", "the kingdom of norway": "NO",
            "oman": "OM", "pakistan": "PK", "palau": "PW", "panama": "PA", "papua new guinea": "PG",
            "paraguay": "PY", "peru": "PE", "philippines": "PH", "poland": "PL",
            "portugal": "PT", "qatar": "QA", "romania": "RO", "russia": "RU",
            "russian federation": "RU", "rwanda": "RW", "saint kitts and nevis": "KN",
            "saint lucia": "LC", "saint vincent and the grenadines": "VC", "samoa": "WS",
            "san marino": "SM", "sao tome and principe": "ST", "saudi arabia": "SA",
            "senegal": "SN", "serbia": "RS", "seychelles": "SC", "sierra leone": "SL",
            "singapore": "SG", "slovakia": "SK", "slovenia": "SI", "solomon islands": "SB",
            "somalia": "SO", "south africa": "ZA", "south korea": "KR", "republic of korea": "KR",
            "south sudan": "SS", "spain": "ES", "sri lanka": "LK", "sudan": "SD", "suriname": "SR",
            "sweden": "SE", "switzerland": "CH", "swiss confederation": "CH", "syria": "SY",
            "syrian arab republic": "SY", "taiwan": "TW", "tajikistan": "TJ", "tanzania": "TZ",
            "united republic of tanzania": "TZ", "thailand": "TH", "timor-leste": "TL",
            "east timor": "TL", "togo": "TG", "tonga": "TO", "trinidad and tobago": "TT",
            "tunisia": "TN", "turkey": "TR", "turkiye": "TR", "turkmenistan": "TM",
            "tuvalu": "TV", "uganda": "UG", "ukraine": "UA", "united arab emirates": "AE",
            "united kingdom": "GB", "united states": "US", "uruguay": "UY", "uzbekistan": "UZ",
            "vanuatu": "VU", "vatican city": "VA", "holy see": "VA", "venezuela": "VE",
            "vietnam": "VN", "viet nam": "VN", "yemen": "YE", "zambia": "ZM", "zimbabwe": "ZW",
            "french guiana": "GF", "turks and caicos islands": "TC", "british virgin islands": "VG",
            "anguilla": "AI", "new caledonia": "NC", "cayman islands": "KY", "bermuda": "BM",
            "french polynesia": "PF", "mainland china, hong kong & macau": "CN", "greenland": "GL",
            "curacao": "CW", "aruba": "AW", "sint maarten": "SX", "sint eustatius": "BQ",
            "bonaire": "BQ", "saba": "BQ",
            # ── [수정 5] 미국무부가 개별 여행경보를 발행하는데 누락되어 있던 지역 ──
            "gibraltar": "GI", "guernsey": "GG", "jersey": "JE", "isle of man": "IM",
            "falkland islands": "FK", "the falkland islands": "FK",
        }

        LEVEL_RE = re.compile(r"level\s*([1-4])", re.IGNORECASE)

        def normalize(name):
            name = name.replace("\u2019", "'").replace("\u2018", "'")
            name = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode()
            name = name.lower().strip()
            name = re.sub(r"\s+", " ", name)
            if name.startswith("the "):
                name = name[4:]
            name = name.replace(",", "").replace(".", "")
            return name

        def extract_countries(country_part):
            whole_key = normalize(country_part)
            if whole_key in NAME_TO_ISO2:
                return [country_part]

            parts = re.split(r'\s+and\s+|\s*,\s*', country_part, flags=re.IGNORECASE)
            valid_countries = []
            for p in parts:
                p_clean = p.strip()
                if p_clean and p_clean.lower() not in ['and', 'or', 'the']:
                    valid_countries.append(p_clean)
            return valid_countries if valid_countries else [country_part]

        tree = ET.parse("state_dept_raw.xml")
        root = tree.getroot()

        results = []
        unmatched = []
        seen_iso2 = set()
        total_items = len(list(root.iter("item")))
        print(f"RSS 원본 item 개수: {total_items}")

        for item in root.iter("item"):
            title_el = item.find("title")
            pubdate_el = item.find("pubDate")
            if title_el is None or not title_el.text:
                continue

            title = title_el.text.strip()
            split_match = re.search(r"\s[-–—]\s", title)
            if not split_match:
                unmatched.append(f"{title} (구분자 미발견)")
                continue

            raw_country_part = title[:split_match.start()]
            level_part = title[split_match.end():]

            raw_country_part = re.sub(r"\s+Travel Advisory$", "", raw_country_part).strip()

            level_match = LEVEL_RE.search(level_part)
            if not level_match:
                unmatched.append(f"{title} (Level 패턴 미발견: '{level_part.strip()[:60]}')")
                continue
            level = int(level_match.group(1))

            parsed_countries = extract_countries(raw_country_part)

            for country_name in parsed_countries:
                key = normalize(country_name)
                iso2 = NAME_TO_ISO2.get(key)

                if not iso2:
                    unmatched.append(country_name)
                    continue

                if iso2 in seen_iso2:
                    continue
                seen_iso2.add(iso2)

                results.append({
                    "iso_code": iso2,
                    "name": country_name,
                    "advisory_level": level,
                    "risk_score": 0.0,
                    "last_updated": pubdate_el.text if pubdate_el is not None else "",
                })

        if "US" not in seen_iso2:
            results.append({
                "iso_code": "US",
                "name": "United States",
                "advisory_level": 1,
                "risk_score": 0.0,
                "last_updated": "RSS Default Protection"
            })
            seen_iso2.add("US")

        # [수정 5] 매핑 실패 목록을 로그로만 흘리지 않고 파일로 저장해 계속 추적 가능하게 함
        with open("data/unmatched_countries.log", "w", encoding="utf-8") as f:
            if unmatched:
                f.write("\n".join(unmatched) + "\n")

        if unmatched:
            print(f"매핑 실패한 국가명 ({len(unmatched)}건) → data/unmatched_countries.log 저장됨:")
            for name in unmatched:
                print("  -", name)
        print(f"총 {len(results)}개국 위험도 추출 완료")

        with open("data/travel_risk.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

        rm -f state_dept_raw.xml

    # 🌟 [2단계] GDACS 실시간 재난 데이터 연동 및 전처리 자동화 (페이지네이션 무시 대응 + dedup판)
    - name: 실시간 재난(GDACS) 데이터 추출
      run: |
        python3 - << 'PYEOF'
        import json
        import re
        import urllib.request
        import urllib.error

        HEADERS = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
            "Accept": "application/json",
        }

        BASE_URL = ("https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH"
                    "?eventlist=EQ;TC;FL;VO;WF;DR;TS&alertlevel=green;orange;red")

        def feature_key(feat):
            props = feat.get("properties", {}) or {}
            etype = props.get("eventtype", "")
            eid = props.get("eventid", "")
            if etype or eid:
                return f"{etype}{eid}"
            return None

        all_features = []
        seen_keys = set()
        MAX_PAGES = 10  
        prev_first_key = None

        for page in range(1, MAX_PAGES + 1):
            url = f"{BASE_URL}&pagenumber={page}"
            try:
                req = urllib.request.Request(url, headers=HEADERS)
                with urllib.request.urlopen(req, timeout=20) as resp:
                    status = resp.status
                    body = resp.read()
            except Exception as e:
                print(f"GDACS 페이지 {page} 요청 실패: {e}")
                break

            print(f"GDACS 페이지 {page} 응답 HTTP 상태코드: {status}, 크기: {len(body)} bytes")

            if status != 200 or not body:
                print(f"⚠️ 페이지 {page} 실패/빈 응답. 페이지네이션 중단.")
                break

            try:
                page_json = json.loads(body)
            except Exception as e:
                print(f"페이지 {page} JSON 파싱 실패: {e}")
                break

            page_features = page_json.get("features")
            if page_features is None:
                for alt_key in ("data", "results", "events", "FeatureCollection"):
                    candidate = page_json.get(alt_key)
                    if isinstance(candidate, dict):
                        candidate = candidate.get("features")
                    if isinstance(candidate, list):
                        page_features = candidate
                        print(f"주의: 페이지 {page}에서 'features' 대신 '{alt_key}' 경로 사용")
                        break

            if not page_features:
                print(f"페이지 {page}: 이벤트 없음. 페이지네이션 종료.")
                break

            page_types = {}
            for feat in page_features:
                t = (feat.get("properties") or {}).get("eventtype", "?")
                page_types[t] = page_types.get(t, 0) + 1
            print(f"  페이지 {page} 타입 분포: {page_types}")

            current_first_key = feature_key(page_features[0]) if page_features else None
            if page > 1 and current_first_key is not None and current_first_key == prev_first_key:
                print(f"⚠️ 페이지 {page}가 이전 페이지와 동일한 이벤트로 시작함 "
                      f"→ 페이지네이션이 더 진행되지 않는 것으로 판단, 중단.")
                break
            prev_first_key = current_first_key

            new_in_page = 0
            for feat in page_features:
                key = feature_key(feat)
                if key is not None and key in seen_keys:
                    continue
                if key is not None:
                    seen_keys.add(key)
                all_features.append(feat)
                new_in_page += 1

            print(f"  → 페이지 {page}: 신규 이벤트 {new_in_page}건 추가 (누적 dedup 합계 {len(all_features)}건)")

            if new_in_page == 0:
                print(f"  페이지 {page}: 신규 이벤트 없음(전부 중복). 페이지네이션 종료.")
                break

        print(f"총 {len(all_features)}건 원본 이벤트 수집 완료 (전체 {page}페이지 순회, dedup 적용)")

        with open("gdacs_all_features.json", "w", encoding="utf-8") as f:
            json.dump(all_features, f, ensure_ascii=False)
        PYEOF

        python3 - << 'PYEOF'
        import json
        import re

        with open("gdacs_all_features.json", encoding="utf-8") as f:
            features = json.load(f)

        from collections import Counter, defaultdict
        type_current_counter = defaultdict(Counter)
        for feat in features:
            props = feat.get("properties", {}) or {}
            etype = props.get("eventtype", "UNKNOWN")
            raw_iscurrent = props.get("iscurrent", "<MISSING>")
            type_current_counter[etype][str(raw_iscurrent)] += 1

        print("=== [디버그] 이벤트 타입별 iscurrent 값 분포 ===")
        for etype, counter in sorted(type_current_counter.items()):
            detail = ", ".join(f"{val}:{cnt}건" for val, cnt in counter.items())
            print(f"  {etype}: {detail}")

        print("=== [디버그] DR(가뭄) 이벤트 개별 상세 ===")
        for feat in features:
            props = feat.get("properties", {}) or {}
            if props.get("eventtype") != "DR":
                continue
            print(f"  eventid={props.get('eventid')} name={props.get('eventname') or props.get('name')} "
                  f"iscurrent={props.get('iscurrent')!r} alertlevel={props.get('alertlevel')} "
                  f"fromdate={props.get('fromdate')} todate={props.get('todate')}")
        print("=== [디버그] 끝 ===")

        results = []
        skipped_not_current = 0
        skipped_duplicate = 0
        seen_result_keys = set()

        GDACS_COUNTRY_MAP = {
            "republic of korea": "South Korea",
            "korea, republic of": "South Korea",
            "united states of america": "United States",
            "us": "United States",
            "viet nam": "Vietnam",
            "russian federation": "Russia",
            "syrian arab republic": "Syria",
            "turkiye": "Turkey"
        }

        def get_centroid(geom):
            if not isinstance(geom, dict):
                return None
            coords = geom.get("coordinates")
            if coords is None:
                return None

            def flatten(c):
                pts = []
                if not isinstance(c, list) or not c:
                    return pts
                if len(c) >= 2 and all(isinstance(x, (int, float)) for x in c[:2]):
                    pts.append((float(c[0]), float(c[1])))
                    return pts
                for sub in c:
                    pts.extend(flatten(sub))
                return pts

            pts = flatten(coords)
            if not pts:
                return None

            lng = sum(p[0] for p in pts) / len(pts)
            lat = sum(p[1] for p in pts) / len(pts)
            return lng, lat

        skipped_no_geom = 0

        for feat in features:
            props = feat.get("properties", {}) or {}
            geom = feat.get("geometry", {}) or {}

            # ── [수정 및 순서 변경] 가뭄(DR) 데이터 누락 해결 핵심부 ──
            event_type_val = props.get("eventtype", "")
            event_id_val = props.get("eventid", "")

            # 현재 진행 중(iscurrent=true)인 것만 수집하되, 가뭄(DR) 타입은 예외로 모두 통과시킵니다.
            is_current = str(props.get("iscurrent", "")).strip().lower()
            if is_current != "true" and event_type_val != "DR":
                skipped_not_current += 1
                continue
            # ─────────────────────────────────────────────────────────

            if event_type_val and event_id_val:
                result_key = f"{event_type_val}{event_id_val}"
                if result_key in seen_result_keys:
                    skipped_duplicate += 1
                    continue
                seen_result_keys.add(result_key)

            centroid = get_centroid(geom)
            if centroid is None:
                skipped_no_geom += 1
                continue
            lng, lat = centroid

            if not (-180 <= lng <= 180 and -90 <= lat <= 90):
                skipped_no_geom += 1
                continue

            raw_country = (props.get("country") or "").strip()
            clean_country = GDACS_COUNTRY_MAP.get(raw_country.lower(), raw_country)

            event_name = props.get("eventname") or props.get("name") or props.get("eventtype", "Disaster")
            title = f"{event_name} - {clean_country}" if clean_country else event_name

            desc = props.get("description") or props.get("htmldescription") or ""
            desc_clean = re.sub(r'<[^>]*>', '', desc).strip()

            if not desc_clean:
                severity_str = (props.get("alertlevel") or "unknown").upper()
                desc_clean = f"A {severity_str} level {event_name} event has been detected near {clean_country or 'coordinates'}: {lat}, {lng}."

            api_report_url = (props.get("url") or {}).get("report", "") if isinstance(props.get("url"), dict) else ""
            if api_report_url:
                report_url = api_report_url
            elif event_type_val and event_id_val:
                report_url = f"https://www.gdacs.org/report.aspx?eventtype={event_type_val}&eventid={event_id_val}"
            else:
                report_url = ""

            results.append({
                "latitude": lat,
                "longitude": lng,
                "title": title,
                "summary": desc_clean,
                "country": clean_country,
                "iso3": props.get("iso3", ""),
                "gdacs_id": f"{event_type_val}{event_id_val}",
                "eventtype": event_type_val,
                "eventid": event_id_val,
                "activation_number": props.get("glide"),
                "event_type": event_type_val,
                "alert_level": props.get("alertlevel", "green"),
                "alert_score": props.get("alertscore", 0),
                "report_url": report_url,
                "last_updated": props.get("todate") or props.get("fromdate") or "",
                "severity": props.get("alertlevel", "green"),
                "is_current": True,
            })

        print(f"총 {len(results)}건 재난 이벤트 정밀 추출 및 정제 완료 "
              f"(좌표 누락 스킵: {skipped_no_geom}건, 진행중 아님 스킵: {skipped_not_current}건, "
              f"중복 스킵: {skipped_duplicate}건)")

        with open("data/realtime_disasters.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

        rm -f gdacs_all_features.json
        echo '{ "status": "success", "data": [] }' > data/realtime_alerts.json

    # 🌟 [2.5단계] 이벤트별 상세정보(사상자·이재민 등 피해규모) 보강
    - name: 재난 상세정보(사상자/영향인구) API 보강
      run: |
        python3 - << 'PYEOF'
        import json
        import re
        import time
        import urllib.request
        import urllib.error

        def fetch_json(url, timeout=15):
            try:
                req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                with urllib.request.urlopen(req, timeout=timeout) as resp:
                    return json.loads(resp.read().decode("utf-8"))
            except Exception as e:
                print(f"  ⚠️ 상세정보 조회 실패: {url} ({e})")
                return None

        with open("data/realtime_disasters.json", encoding="utf-8") as f:
            payload = json.load(f)

        results = payload.get("data", [])

        SEVERITY_ORDER = {"red": 0, "orange": 1, "green": 2}
        results.sort(key=lambda r: SEVERITY_ORDER.get(str(r.get("alert_level", "green")).lower(), 3))

        enrich_count = 0
        enriched_ok = 0

        EVENT_TYPE_NAME = {
            "EQ": "earthquake", "TC": "tropical cyclone", "FL": "flood",
            "WF": "wildfire", "VO": "volcanic event", "DR": "drought",
            "TS": "tsunami",
        }
        IMPACT_LEVEL = {"green": "low", "orange": "medium", "red": "significant"}
        IMPACT_BASIS = {
            "EQ": "the magnitude", "TC": "the wind speed", "FL": "the flood extent",
            "WF": "the affected area", "VO": "the eruption size", "DR": "the drought severity",
            "TS": "the wave height",
        }

        for r in results:
            r_eventtype = r.get("eventtype") or r.get("event_type") or ""
            r_alertlevel = str(r.get("alert_level", "green")).lower()
            r["report_description"] = (
                f"This {EVENT_TYPE_NAME.get(r_eventtype, 'event')} can have a "
                f"{IMPACT_LEVEL.get(r_alertlevel, 'unknown')} humanitarian impact "
                f"based on {IMPACT_BASIS.get(r_eventtype, 'the severity')} and the "
                f"affected population and their vulnerability."
            )

            eventtype = r.get("eventtype") or r.get("event_type")
            eventid = r.get("eventid")

            if not eventid:
                m = re.search(r"(\d+)$", str(r.get("gdacs_id", "")))
                if m:
                    eventid = m.group(1)

            if not eventtype or not eventid:
                continue

            detail_url = f"https://www.gdacs.org/gdacsapi/api/events/geteventdata?eventtype={eventtype}&eventid={eventid}"
            detail = fetch_json(detail_url)
            enrich_count += 1
            time.sleep(0.6)  

            if not detail:
                continue

            props = detail.get("properties", detail) or {}
            sendai = props.get("sendai") or []
            severity = props.get("severitydata") or {}
            images = props.get("images") or {}

            deaths = 0
            displaced = 0
            missing = 0
            deaths_found = False
            displaced_found = False
            missing_found = False
            sendai_details = []

            for s in sendai:
                name = (s.get("sendainame") or "").lower()
                try:
                    val = int(re.sub(r"[^\d]", "", str(s.get("sendaivalue", "0"))) or 0)
                except ValueError:
                    val = 0

                if "death" in name:
                    deaths += val
                    deaths_found = True
                elif "displaced" in name or "evacuat" in name:
                    displaced += val
                    displaced_found = True
                elif "missing" in name:
                    missing += val
                    missing_found = True

                sendai_details.append({
                    "type": s.get("sendaitype"),
                    "name": s.get("sendainame"),
                    "value": s.get("sendaivalue"),
                    "region": s.get("region"),
                    "description": s.get("description"),
                    "date": s.get("dateinsert"),
                    "latest": s.get("latest"),
                })

            r["deaths"] = deaths if deaths_found else None
            r["displaced"] = displaced if displaced_found else None
            r["missing"] = missing if missing_found else None

            r["severity_text"] = severity.get("severitytext")
            r["impact_history"] = sendai_details
            r["impact_description"] = (sendai_details[-1]["description"][:300] if sendai_details else None)
            r["overview_map_url"] = images.get("overviewmap") or images.get("overviewmap_cached")
            r["report_detail_url"] = detail_url

            enriched_ok += 1

        print(f"상세정보 API 호출 {enrich_count}건 중 {enriched_ok}건 보강 완료 (한도 없이 green 포함 전체 처리)")

        with open("data/realtime_disasters.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

    # 🌟 [3단계] 최종 데이터 변경 감지 및 자동 배포
    - name: 변경사항 자동 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add data/travel_risk.json data/realtime_disasters.json data/realtime_alerts.json data/unmatched_countries.log

        if ! git diff --cached --exit-code; then
          git commit -m "🐛 가뭄(DR) 데이터 누락 방지를 위한 iscurrent 예외 필터링 조건 추가 및 파싱 순서 조율"
          git push
        else
          echo "업데이트된 신규 위험 정보 없음"
        fi
