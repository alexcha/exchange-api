name: Update Travel & Disaster Data

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간(KST) 새벽 3시 자동 실행
  workflow_dispatch:     # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  fetch-and-clean:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: data 디렉토리 생성
      run: mkdir -p data

    # 🌟 [1단계] UN OCHA(유엔 인도주의업무조정국) ReliefWeb 공식 API로 국가별 실시간 위험도 추출
    # 실시간성 완벽, 전 세계 모든 국가의 ISO2 코드가 JSON에 무조건 포함되어 내려옵니다.
    - name: 국가별 위험도 데이터 추출 (UN ReliefWeb API)
      run: |
        curl -f -s -X POST "https://api.reliefweb.int/v1/countries?appname=global-travel-safety&limit=250&preset=full" \
          -H "Content-Type: application/json" \
          -d '{"filter": {"field": "status", "value": "current"}}' -o un_reliefweb_raw.json || echo '{"data":[]}' > un_reliefweb_raw.json

        python3 - << 'PYEOF'
        import json

        try:
            with open("un_reliefweb_raw.json", encoding="utf-8") as f:
                raw_data = json.load(f)
        except Exception as e:
            print(f"UN API 파싱 실패: {e}")
            raw_data = {"data": []}

        records = raw_data.get("data", [])
        results = []

        for item in records:
            fields = item.get("fields", {})
            iso2 = fields.get("iso3") # ReliefWeb은 기본적으로 ISO 코드를 표준 제공합니다.
            if not iso2:
                continue
            
            # API 내부의 프로필 데이터를 기반으로 리스크 점수 환산 
            # (기본값은 안정 상태인 1.0, 분쟁이나 재난 진행 수치에 따라 가산)
            current_disasters = fields.get("current_disasters", [])
            base_score = 1.0 + (len(current_disasters) * 2.5)
            risk_score = min(10.0, max(1.0, round(base_score, 1)))

            # 국가명과 ISO 코드 바인딩 (유실 가능성 0%)
            results.append({
                "iso_code": iso2[:2].upper(), # ISO 2자리 형태로 가공
                "name": fields.get("name"),
                "risk_score": risk_score,
                "last_updated": fields.get("updated", "")
            })

        print(f"총 {len(results)}개국 실시간 위험도(UN ReliefWeb) 추출 완료")

        with open("data/travel_risk.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

        rm -f un_reliefweb_raw.json

    # 🌟 [2단계] GDACS 공식 API에서 실시간 재난 데이터 직접 추출 (지도 마커용)
    - name: 실시간 재난(GDACS) 데이터 추출
      run: |
        curl -f -s "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=EQ;TC;FL;VO;WF;DR&alertlevel=green;orange;red" \
          -o gdacs_raw.json || echo '{"features":[]}' > gdacs_raw.json

        python3 - << 'PYEOF'
        import json

        try:
            with open("gdacs_raw.json", encoding="utf-8") as f:
                raw = json.load(f)
        except Exception as e:
            print(f"GDACS 응답 파싱 실패: {e}")
            raw = {"features": []}

        features = raw.get("features", [])
        results = []

        for feat in features:
            props = feat.get("properties", {})
            geom = feat.get("geometry", {}) or {}
            coords = geom.get("coordinates", [])

            if not coords or len(coords) < 2:
                continue
            lng, lat = coords[0], coords[1]

            event_type = props.get("eventtype", "Disaster")
            country = props.get("country", "")
            title = f"[{event_type}] {props.get('eventname', 'Disaster')}"
            if country:
                title += f" - {country}"

            results.append({
                "latitude": lat,
                "longitude": lng,
                "type": event_type,
                "title": title,
                "summary": props.get("description", "") or props.get("htmldescription", ""),
                "last_updated": props.get("todate") or props.get("fromdate") or "",
                "severity": props.get("alertlevel", "").lower(),
            })

        print(f"총 {len(results)}건 재난 마커 데이터 추출 완료")

        with open("data/realtime_disasters.json", "w", encoding="utf-8") as f:
            json.dump({"status": "success", "data": results}, f, ensure_ascii=False, indent=2)
        PYEOF

        rm -f gdacs_raw.json
        echo '{ "status": "success", "data": [] }' > data/realtime_alerts.json

    # 🌟 [3단계] 변동 사항이 있을 때만 깃허브에 커밋 및 푸시
    - name: 변경사항 자동 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add data/travel_risk.json data/realtime_disasters.json data/realtime_alerts.json
        
        if ! git diff --cached --exit-code; then
          git commit -m "⚡ UN ReliefWeb + GDACS 공식 API 기반 실시간 글로벌 데이터 갱신"
          git push
        else
          echo "업데이트된 신규 위험 정보 없음"
        fi
