name: Update Travel & Disaster Data

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간(KST) 새벽 3시 자동 실행
  workflow_dispatch:     # 수동 실행 버튼 활성화

jobs:
  fetch-and-clean:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: data 디렉토리 생성
      run: mkdir -p data

    # 🌟 [1단계] 국가별 기본 위험도 정보 수집 및 중복/인덱스 정제
    - name: 국가별 위험도 데이터 추출 및 정제
      run: |
        curl -f -s -X GET \
          -H "X-API-Key: ${{ secrets.TRAVEL_RISK_API_KEY }}" \
          -H "Accept: application/json" \
          "https://travelriskapi.com/api/v1/countries?skip=0&limit=100" > page1.json

        curl -f -s -X GET \
          -H "X-API-Key: ${{ secrets.TRAVEL_RISK_API_KEY }}" \
          -H "Accept: application/json" \
          "https://travelriskapi.com/api/v1/countries?skip=100&limit=100" > page2.json

        # 고유 iso_code 기준으로 객체 정렬 및 중복 제거 후 배열로 변환
        jq -n '
          [inputs.data[]] | 
          reduce .[] as $item ({}; .[$item.iso_code] = $item) | 
          {
            status: "success",
            data: [ .[] ]
          }
        ' page1.json page2.json > data/travel_risk.json

        rm page1.json page2.json

    # 🌟 [2단계] 실시간 재난 정보 수집 (404/403 에러 발생 시 공백 데이터로 우회 처리)
    - name: 실시간 재난(Disasters) 피드 데이터 추출
      run: |
        curl -f -s -X GET \
          -H "X-API-Key: ${{ secrets.TRAVEL_RISK_API_KEY }}" \
          -H "Accept: application/json" \
          "https://travelriskapi.com/api/v1/disasters" > data/realtime_disasters.json || \
        echo "{ \"status\": \"success\", \"data\": [] }" > data/realtime_disasters.json

    # 🌟 [3단계] 실시간 긴급 알림 수집 (404/403 에러 발생 시 공백 데이터로 우회 처리)
    - name: 실시간 긴급 경보(Alerts) 피드 데이터 추출
      run: |
        curl -f -s -X GET \
          -H "X-API-Key: ${{ secrets.TRAVEL_RISK_API_KEY }}" \
          -H "Accept: application/json" \
          "https://travelriskapi.com/api/v1/alerts" > data/realtime_alerts.json || \
        echo "{ \"status\": \"success\", \"data\": [] }" > data/realtime_alerts.json

    # 🌟 [4단계] 변동 사항이 있을 때만 깃허브에 커밋 및 푸시
    - name: 변경사항 자동 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add data/travel_risk.json data/realtime_disasters.json data/realtime_alerts.json
        
        if ! git diff --cached --exit-code; then
          git commit -m "⚡ 실시간 위험도 및 재난 데이터 통합 정기 업데이트"
          git push
        else
          echo "업데이트된 신규 위험 정보 없음"
        fi
