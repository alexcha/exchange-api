name: Update Travel Risk Data

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간(KST) 새벽 3시마다 자동으로 실행
  workflow_dispatch:     # 수동 실행 버튼 활성화

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: data 디렉토리 생성 및 API 호출 저장
      run: |
        # 🌟 data 폴더가 없으면 새로 생성하는 명령어
        mkdir -p data
        
        # 🌟 data/ 폴더 밑에 travel_risk.json 이름으로 저장
        curl -s -X GET \
          -H "X-API-Key: ${{ secrets.TRAVEL_RISK_API_KEY }}" \
          -H "Accept: application/json" \
          "https://travelriskapi.com/api/v1/countries?limit=1000" > data/travel_risk.json

    - name: 변경사항이 있으면 깃허브에 자동으로 커밋/푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/travel_risk.json
        if ! git diff --cached --exit-code; then
          git commit -m "⚡ data 디렉토리 내 안전 데이터 자동 업데이트"
          git push
        else
          echo "변경 사항 없음"
        fi
